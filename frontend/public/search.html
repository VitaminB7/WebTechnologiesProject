<!doctype html>
<!-- search.html — หน้าค้นหาห้อง: ตัวกรอง + การ์ดผลลัพธ์ + แบ่งหน้า (ตัวกรองถูกเก็บใน URL ด้วย) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Rooms · CONDONG condo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&family=Open+Sans:wght@600&family=Outfit:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html" aria-label="CONDONG condo — home">
        <span class="brand__logo" aria-hidden="true">CD</span>
        <span class="brand__text" aria-hidden="true"><span class="brand__name">Condong</span><span class="brand__sub">Condo</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="search.html" class="is-active" aria-current="page">Search</a>
        <a href="team.html">Team</a>
      </nav>
      <!-- ปุ่ม Login (ถ้าล็อกอินอยู่ common.js เปลี่ยนเป็นปุ่ม Admin) -->
      <div id="header-actions" class="header-actions">
        <a class="account-pill" href="login.html"><img src="img/icon-user.svg" alt=""><span>Login</span></a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1 class="visually-hidden">Search rooms</h1>

      <form id="filter-form" class="filter-bar" novalidate>
        <div class="filter-grid">
          <div class="field">
            <label for="f-type">Room type</label>
            <select id="f-type" name="type">
              <option value="">Any type</option>
              <option value="Studio">Studio</option>
              <option value="1 Bedroom">1 Bedroom</option>
              <option value="2 Bedroom">2 Bedroom</option>
              <option value="Deluxe room">Deluxe room</option>
            </select>
          </div>
          <div class="field">
            <label for="f-floor">Floor number</label>
            <input id="f-floor" name="floor" type="number" min="1" max="99" step="1" inputmode="numeric" placeholder="Any floor">
          </div>
          <div class="field">
            <label for="f-condition">Room Condition</label>
            <select id="f-condition" name="minCondition">
              <option value="">Any condition</option>
              <option value="1">1★ ขึ้นไป (แย่)</option>
              <option value="2">2★ ขึ้นไป (พอใช้)</option>
              <option value="3">3★ ขึ้นไป (สภาพดี)</option>
              <option value="4">4★ ขึ้นไป (ดีมาก)</option>
              <option value="5">5★ (ใหม่มาก)</option>
            </select>
          </div>
          <div class="field">
            <label for="f-min-price">Min rent / month</label>
            <input id="f-min-price" name="minPrice" type="number" min="0" step="500" inputmode="numeric" placeholder="฿10,000">
          </div>
          <div class="field">
            <label for="f-max-price">Max rent / month</label>
            <input id="f-max-price" name="maxPrice" type="number" min="0" step="500" inputmode="numeric" placeholder="฿35,000">
          </div>
        </div>

        <div class="filter-actions">
          <div class="filter-actions__left">
            <label class="chip">
              <input type="checkbox" name="available" value="true">
              Available only
            </label>
            <button type="button" id="clear-filters" class="link-button">Clear all filters</button>
          </div>
          <button type="submit" class="btn btn--green btn--search">Search Room</button>
        </div>
        <p class="form-error hidden" role="alert"></p>
      </form>

      <section aria-label="Search results">
        <p id="results-count" class="visually-hidden" aria-live="polite"></p>
        <div id="results" class="card-grid card-grid--search"></div>
        <nav id="pagination" class="pagination" aria-label="Search results pages"></nav>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
