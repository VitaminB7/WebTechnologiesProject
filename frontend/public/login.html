<!doctype html>
<!-- login.html — หน้าเข้าสู่ระบบของผู้ดูแล (Admin / SuperAdmin) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · CONDONG condo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&family=Open+Sans:wght@600&family=Outfit:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html" aria-label="CONDONG condo — home">
        <span class="brand__logo" aria-hidden="true">CD</span>
        <span class="brand__text" aria-hidden="true"><span class="brand__name">Condong</span><span class="brand__sub">Condo</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="team.html">Team</a>
      </nav>
      <!-- ถ้าล็อกอินอยู่แล้ว login.js จะพาไปหน้าแอดมินเลย -->
      <div id="header-actions" class="header-actions">
        <a class="account-pill" href="login.html" aria-current="page"><img src="img/icon-user.svg" alt=""><span>Login</span></a>
      </div>
    </div>
  </header>

  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" class="visually-hidden">Admin login</h1>
      <div class="login-card__head">
        <a class="brand" href="index.html" aria-label="CONDONG condo — home">
          <span class="brand__logo" aria-hidden="true">CD</span>
          <span class="brand__text" aria-hidden="true"><span class="brand__name">Condong</span><span class="brand__sub">Condo</span></span>
        </a>
      </div>

      <form id="login-form" class="login-card__body" novalidate>
        <div class="field">
          <label for="username">Username / Email</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="e.g., admin_main" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <hr class="login-card__line">
        <button id="login-submit" class="btn btn--dark btn--block" type="submit">Login</button>
        <p class="form-error hidden" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
