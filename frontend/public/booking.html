<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Room · AURA Sukhumvit 36</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="page">
    <div class="container booking-layout">
      <div id="booking-state"></div>

      <div id="booking-card" class="card booking-card hidden">
        <h1>Booking Information</h1>
        <p class="muted">Please fill up the blank fields below</p>

        <div id="booking-room" class="booking-room"></div>

        <form id="booking-form" novalidate>
          <div class="form-grid">
            <div class="field field--full">
              <label for="b-full-name">Full name <span class="required">*</span></label>
              <input id="b-full-name" name="fullName" type="text" autocomplete="name" maxlength="150" required>
            </div>
            <div class="field">
              <label for="b-identity">Identity Number <span class="required">*</span></label>
              <input id="b-identity" name="identityNumber" type="text" inputmode="numeric" maxlength="13"
                     placeholder="13 digits" autocomplete="off" required>
            </div>
            <div class="field">
              <label for="b-phone">Phone <span class="required">*</span></label>
              <input id="b-phone" name="phone" type="tel" autocomplete="tel" maxlength="20"
                     placeholder="0801231234" required>
            </div>
            <div class="field">
              <label for="b-email">Email <span class="required">*</span></label>
              <input id="b-email" name="email" type="email" autocomplete="email" maxlength="100" required>
            </div>
            <div class="field">
              <label for="b-move-in">Move-in date <span class="required">*</span></label>
              <input id="b-move-in" name="moveInDate" type="date" required>
            </div>
          </div>

          <p class="form-error hidden" role="alert"></p>

          <div class="form-actions">
            <a id="booking-cancel" class="btn btn--grey" href="search.html">Cancel</a>
            <button id="booking-submit" type="submit" class="btn btn--primary">Book Now</button>
          </div>
        </form>
      </div>

      <div id="booking-confirmation" class="card confirmation hidden" role="status" tabindex="-1"></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/booking.js"></script>
</body>
</html>
