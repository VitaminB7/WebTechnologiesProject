<!doctype html>
<!-- login.html — หน้าเข้าสู่ระบบของผู้ดูแล (Admin / SuperAdmin) -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · CONDONG condo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&family=Open+Sans:wght@600&family=Outfit:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
  <header id="site-header" class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="CONDONG condo — home">
        <span class="brand__logo" aria-hidden="true">CD</span>
        <span class="brand__text" aria-hidden="true"><span class="brand__name">Condong</span><span
            class="brand__sub">Condo</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/team">Team</a>
      </nav>
      <!-- ถ้าล็อกอินอยู่แล้ว login.js จะพาไปหน้าแอดมินเลย -->
      <div id="header-actions" class="header-actions">
        <a class="account-pill" href="/login" aria-current="page"><img src="img/icon-user.svg"
            alt=""><span>Login</span></a>
      </div>
    </div>
  </header>

  <main class="login-page">
    <div class="login-wrap">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card__head">
          <a class="brand" href="/" aria-label="CONDONG condo — home">
            <span class="brand__logo" aria-hidden="true">CD</span>
            <span class="brand__text" aria-hidden="true"><span class="brand__name">Condong</span><span
                class="brand__sub">Condo</span></span>
          </a>
        </div>

        <form id="login-form" class="login-card__body" novalidate>
          <div class="login-card__intro">
            <h1 id="login-title">Admin login</h1>
            <p>Sign in to manage rooms and accounts.</p>
          </div>
          <div class="field">
            <label for="username">Username / Email</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="e.g., admin_main"
              required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <!-- ปุ่มตาสลับ แสดง/ซ่อน รหัสผ่าน (login.js) -->
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                placeholder="Enter your password" required>
              <button type="button" id="toggle-password" class="password-toggle" aria-controls="password"
                aria-pressed="false" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 3l18 18" />
                  <path
                    d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.2 17.2 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                </svg>
              </button>
            </div>
          </div>
          <button id="login-submit" class="btn btn--dark btn--block login-card__submit" type="submit">Login</button>
          <p class="form-error hidden" role="alert"></p>
        </form>
      </section>
      <a class="login-back" href="/"><span aria-hidden="true">←</span> Back to home</a>
    </div>
  </main>

  <script src="js/api-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
